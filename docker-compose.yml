name: gemini-api2cli

services:
  gemini-api2cli:
    image: "${GEMINI_API2CLI_IMAGE:-dlaq/gemini-api2cli:latest}"
    container_name: gemini-api2cli
    restart: unless-stopped
    init: true
    pull_policy: always

    ports:
      - "${GEMINI_API2CLI_PORT:-41242}:41242"

    environment:
      GEMINI_PROMPT_API_TOKEN: "${GEMINI_PROMPT_API_TOKEN:-root}"
      CODER_AGENT_HOST: "0.0.0.0"
      CODER_AGENT_PORT: "41242"
      ENABLE_A2A: "${ENABLE_A2A:-false}"
      HOME: "/home/node"

      # 可选代理
      HTTPS_PROXY: "${HTTPS_PROXY:-}"
      HTTP_PROXY: "${HTTP_PROXY:-}"
      NO_PROXY: "${NO_PROXY:-127.0.0.1,localhost}"

    volumes:
      # 挂载 Gemini CLI / Google OAuth 凭证及配置持久化目录
      - ./data:/home/node/.gemini

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:41242/manage').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
